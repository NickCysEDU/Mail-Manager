[project]
name = "mail-manager"
version = "1.1.0"
description = "Sort your mail on your Mac. Offline by default; a language model if you want one."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# A hung test must never wedge the build; the suite runs in ~12s.
# -n 4 --dist loadfile: four workers, each taking whole files. Whole files
# matters because the Qt tests share one QApplication per process, and it is
# the difference between six minutes and two and a half.
addopts = "-q --strict-markers --strict-config --timeout=60 --timeout-method=thread -n 4 --dist loadfile"
filterwarnings = [
    "error::DeprecationWarning:gui",
    "error::DeprecationWarning:models",
    "error::DeprecationWarning:imap_engine",
    "error::DeprecationWarning:llm_engine",
    "error::DeprecationWarning:config",
    "error::DeprecationWarning:workers",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "tools/*", ".venv/*", "build/*", "dist/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
