name: tests

# Every push and every pull request. The suite is about three minutes on
# four workers and needs no network, no mailbox and no API key, so there is
# nothing to gate it behind.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests
        # Qt needs a platform plugin even with no screen attached.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: The offline sorter still scores what it should
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for set in labelled adversarial holdout meetings acknowledgements; do
            python tools/evaluate.py --file "tests/fixtures/$set.json"
          done

      - name: It still starts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --self-test --offline

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyflakes
      # Every module has to import cleanly and name nothing it has not
      # defined. The GUI ones re-export deliberately, which pyflakes reads as
      # unused, so those are checked for undefined names only.
      - name: pyflakes
        run: |
          python -m pyflakes $(git ls-files '*.py' | grep -v '^gui.py$') \
            | grep -v 'imported but unused' | tee /tmp/flakes
          test ! -s /tmp/flakes
