name: tests

# Every push and every pull request. The suite is about three minutes on
# four workers and needs no network, no mailbox and no API key, so there is
# nothing to gate it behind.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    # A hosted macOS runner is several times slower than a developer's Mac:
    # a suite that takes three minutes here takes most of half an hour there.
    # This is sized for that, not for the local number.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests
        # Qt needs a platform plugin even with no screen attached. A step
        # timeout rather than only the job's, because a cancelled job throws
        # its log away and a timed-out step keeps it.
        timeout-minutes: 40
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

      - name: The offline sorter still scores what it should
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for set in labelled adversarial holdout meetings acknowledgements; do
            python tools/evaluate.py --file "tests/fixtures/$set.json"
          done

      - name: It still starts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --self-test --offline

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyflakes
      # Every module has to import cleanly and name nothing it has not
      # defined. The GUI ones re-export deliberately, which pyflakes reads as
      # unused, so those are checked for undefined names only.
      - name: pyflakes
        run: |
          python -m pyflakes $(git ls-files '*.py' | grep -v '^gui.py$') \
            | grep -v 'imported but unused' | tee /tmp/flakes
          test ! -s /tmp/flakes

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      # Reports rather than blocks. The cryptography pin is deliberate and
      # explained in SECURITY.md: the advisories are in PKCS#7 and the X.509
      # verifier, neither of which this app calls, and the versions that fix
      # them publish no universal2 wheel, so taking them would drop every
      # Intel Mac. A new finding in anything else is worth a look, which is
      # what this is for.
      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off
