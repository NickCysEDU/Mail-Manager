name: tests

# Every push and every pull request. The suite is about three minutes on
# four workers and needs no network, no mailbox and no API key, so there is
# nothing to gate it behind.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    # Headroom, not an expectation. The suite is minutes; installing PySide6
    # and building the universal wheels is the slow part, and a hosted runner
    # having a bad day should not read as a broken commit.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests
        # Qt needs a platform plugin even with no screen attached.
        # TEMPORARY: serial and verbose, with a step timeout shorter than the
        # job's, so that a run which does not finish still hands back its log.
        # A cancelled job discards it, which is why three runs in a row said
        # nothing about where they stopped.
        timeout-minutes: 12
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: python -m pytest -p no:randomly -n 0 -v --timeout=120 --timeout-method=thread 2>&1 | tail -120

      - name: The offline sorter still scores what it should
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          for set in labelled adversarial holdout meetings acknowledgements; do
            python tools/evaluate.py --file "tests/fixtures/$set.json"
          done

      - name: It still starts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python main.py --self-test --offline

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pyflakes
      # Every module has to import cleanly and name nothing it has not
      # defined. The GUI ones re-export deliberately, which pyflakes reads as
      # unused, so those are checked for undefined names only.
      - name: pyflakes
        run: |
          python -m pyflakes $(git ls-files '*.py' | grep -v '^gui.py$') \
            | grep -v 'imported but unused' | tee /tmp/flakes
          test ! -s /tmp/flakes
