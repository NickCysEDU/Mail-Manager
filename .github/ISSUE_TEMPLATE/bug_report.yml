name: Bug report
description: Something behaved differently from how it is documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real message text, a real address or a credential.
        A description of the shape of the message is enough, and a redacted
        subject line is usually plenty.

  - type: input
    id: build
    attributes:
      label: Which build
      description: >
        The bottom-right corner of the window, or `Mail Manager --version`.
        Click the corner to copy the whole line.
      placeholder: 1.0.0 · build a1b2c3d · built 2026-09-11 · Python 3.11.9 · Apple silicon
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Which sorter
      options:
        - Local rules (the default, no key)
        - On this Mac (Ollama)
        - Claude (Anthropic)
        - Gemini (Google AI Studio)
        - OpenAI-compatible
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Anything from the log
      description: >
        `~/Library/Logs/Mail Manager/triage.log`, or View, Show activity log
        in the window. Message bodies are never written to it, but check
        before pasting.
      render: text
