# Dependency updates, batched weekly so the repository is not a stream of
# single-package pull requests.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Zero, which is the documented way to say "security updates only".
    #
    # The requirements files state a deliberately loose floor with the exact
    # version it was tested against in a comment beside it. Raising the floor
    # to whatever happens to be installed narrows what can install the app,
    # gains nothing, and leaves every line contradicting its own comment.
    # Security advisories are unaffected by this setting and still open a
    # pull request.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
