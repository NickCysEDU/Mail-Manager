# Dependency updates, batched weekly so the repository is not a stream of
# single-package pull requests.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-packages:
        patterns: ["*"]
    # The requirements files state a deliberately loose floor with the exact
    # version it was tested against in a comment beside it. Raising the floor
    # to whatever happens to be installed narrows what can install the app and
    # gains nothing, so only a security fix is worth a pull request here.
    #
    # GitHub raises security updates regardless of this.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
